<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        .m-stage { position: absolute; inset: 0; }
        .sig-tabs { position: absolute; left: 120px; right: 120px; top: 130px; display: flex; gap: 56px; border-bottom: 2px solid var(--line); }
        .sig-tab { font: 700 24px var(--mono); letter-spacing: 0.18em; color: var(--dim); padding-bottom: 20px; position: relative; }
        .sig-tab .bar { position: absolute; left: 0; right: 0; bottom: -2px; height: 4px; background: var(--amber); transform-origin: left center; display: block; }
        .m-tiles { position: absolute; left: 120px; right: 120px; top: 240px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px; }
        .m-tile { padding: 28px 32px; }
        .m-tile .t { font: 700 19px var(--mono); letter-spacing: 0.16em; color: var(--muted); }
        .m-tile .v { font-family: var(--serif); font-size: 96px; line-height: 1.1; margin-top: 6px; }
        .m-tile .u { font: 400 22px var(--mono); color: var(--dim); }
        .m-chart { position: absolute; left: 120px; right: 120px; top: 520px; height: 400px; padding: 26px 32px; }
        .m-chart .t { font: 700 19px var(--mono); letter-spacing: 0.16em; color: var(--muted); }
        .m-chart svg { position: absolute; left: 32px; top: 70px; width: 1616px; height: 300px; overflow: visible; }
        .m-alert { position: absolute; right: 32px; top: 18px; border-color: rgba(242, 89, 75, 0.6); }
        .m-which { position: absolute; left: 700px; top: 92px; background: var(--bg); }
      </style>
      <div id="root" data-composition-id="s05-metrics" data-width="1920" data-height="1080">
        <div class="sig-tabs">
          <div class="sig-tab m-t1">01 LOGS<span class="bar m-b1"></span></div>
          <div class="sig-tab m-t2">02 METRICS<span class="bar m-b2"></span></div>
          <div class="sig-tab">03 TRACES</div>
          <div class="sig-tab">04 SPANS</div>
        </div>
        <div class="m-stage">
          <div class="m-tiles">
            <div class="panel m-tile"><div class="t">REQUESTS / MIN</div><div class="v m-v1">0</div></div>
            <div class="panel m-tile"><div class="t">P95 LATENCY</div><div class="v m-v2">0.0s</div></div>
            <div class="panel m-tile"><div class="t">TOKENS TODAY</div><div class="v m-v3">0.0M</div></div>
            <div class="panel m-tile"><div class="t">COST TODAY</div><div class="v m-v4">$0.00</div></div>
          </div>
          <div class="panel m-chart">
            <div class="t">P95 LATENCY · LAST 60 MIN</div>
            <div class="chip m-alert"><span class="led err"></span>ALERT  p95 &gt; 5s</div>
            <svg viewBox="0 0 1616 300">
              <line x1="0" y1="110" x2="1616" y2="110" stroke="#f2594b" stroke-width="3" stroke-dasharray="10 10" opacity="0.7" />
              <text x="0" y="98" fill="#f2594b" font-family="JetBrains Mono" font-size="20">5s threshold</text>
              <rect class="m-spikebox" x="1270" y="0" width="346" height="300" rx="12" fill="rgba(245,168,0,0.12)" stroke="#f5a800" stroke-width="3" />
              <path class="m-line" fill="none" stroke="#7b8ff5" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" d="" />
            </svg>
            <div class="chip m-which"><span class="led warn"></span>Something changed. Which request?</div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const D = 15.86;
          const tl = gsap.timeline({ paused: true });
          // latency series (seconds), deterministic, spike near the end
          const vals = [1.9,2.0,1.8,2.1,2.2,1.9,2.0,2.3,2.1,2.0,1.9,2.2,2.4,2.1,2.0,2.2,2.3,2.1,2.0,2.2,2.1,2.4,2.2,2.0,2.1,2.3,2.2,2.5,2.4,2.6,3.4,5.6,6.4,6.2,5.9,6.3,6.1,6.2];
          const W = 1616, H = 300, max = 7.5;
          const d = vals.map((v, i) => `${i ? "L" : "M"}${(i / (vals.length - 1) * W).toFixed(1)},${(H - v / max * H).toFixed(1)}`).join(" ");
          const path = document.querySelector(".m-line");
          path.setAttribute("d", d);
          const len = path.getTotalLength();
          path.style.strokeDasharray = len;

          // tab switch from LOGS to METRICS
          tl.set(".m-t1", { color: "#eeeae0" }, 0);
          tl.fromTo(".m-b1", { scaleX: 1, opacity: 1 }, { scaleX: 0, duration: 0.4, ease: "power2.in" }, 0.1);
          tl.to(".m-t1", { color: "#737c95", duration: 0.3 }, 0.2);
          tl.to(".m-t2", { color: "#eeeae0", duration: 0.3 }, 0.3);
          tl.fromTo(".m-b2", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.4);

          tl.fromTo(".m-tile", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.12, ease: "expo.out" }, 0.4);
          const count = (sel, at, to, fmt) => {
            const el = document.querySelector(sel), o = { v: 0 };
            tl.fromTo(o, { v: 0 }, { v: to, duration: 1.4, ease: "power3.out", onUpdate: () => (el.textContent = fmt(o.v)) }, at);
          };
          count(".m-v1", 3.0, 1240, (v) => Math.round(v).toLocaleString("en-US"));
          count(".m-v2", 4.3, 6.2, (v) => v.toFixed(1) + "s");
          count(".m-v3", 6.6, 9.1, (v) => v.toFixed(1) + "M");
          count(".m-v4", 7.8, 41.2, (v) => "$" + v.toFixed(2));
          tl.to(".m-v2", { color: "#f2594b", duration: 0.3 }, 5.4);

          // dashboards and alerts
          tl.fromTo(".m-chart", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 9.0);
          tl.fromTo(path, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: 2.2, ease: "power1.inOut" }, 9.3);
          tl.fromTo(".m-alert", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.4)" }, 10.9);
          // something changed, not which request
          tl.fromTo(".m-spikebox", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 12.3);
          tl.fromTo(".m-which", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.8)" }, 13.8);
          tl.to(".m-stage", { opacity: 0, duration: 0.4, ease: "power1.in" }, D - 0.42);
          window.__timelines["s05-metrics"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
