<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        .t-stage { position: absolute; inset: 0; }
        .sig-tabs { position: absolute; left: 120px; right: 120px; top: 130px; display: flex; gap: 56px; border-bottom: 2px solid var(--line); }
        .sig-tab { font: 700 24px var(--mono); letter-spacing: 0.18em; color: var(--dim); padding-bottom: 20px; position: relative; }
        .sig-tab .bar { position: absolute; left: 0; right: 0; bottom: -2px; height: 4px; background: var(--amber); transform-origin: left center; display: block; }
        .t-wf { position: absolute; left: 120px; top: 250px; width: 1130px; height: 660px; padding: 34px 40px; }
        .t-id { font: 400 26px var(--mono); color: var(--muted); display: flex; gap: 18px; align-items: center; }
        .t-id .hex { color: var(--amber); display: block; overflow: hidden; white-space: nowrap; width: 560px; }
        .t-axis { position: relative; margin: 34px 0 10px 340px; height: 30px; border-bottom: 2px solid var(--line); font: 400 20px var(--mono); color: var(--dim); }
        .t-axis span { position: absolute; top: 0; }
        .t-row { position: relative; display: flex; align-items: center; height: 92px; }
        .t-name { width: 340px; font: 400 27px var(--mono); color: var(--fg); display: flex; align-items: center; gap: 12px; }
        .t-name .ind { color: var(--dim); }
        .t-track { position: relative; flex: 1; height: 100%; }
        .t-bar { position: absolute; top: 24px; height: 44px; border-radius: 8px; transform-origin: left center; }
        .t-dur { position: absolute; top: 33px; font: 400 22px var(--mono); color: var(--muted); white-space: nowrap; }
        .t-root .t-bar { left: 0%; width: 100%; background: rgba(238, 234, 224, 0.2); border: 2px solid rgba(238, 234, 224, 0.5); }
        .t-r1 .t-bar { left: 0%; width: 8%; background: var(--ok); }
        .t-r2 .t-bar { left: 8%; width: 36%; background: var(--amber); }
        .t-r3 .t-bar { left: 44%; width: 54%; background: var(--indigo); }
        .t-retry { position: absolute; left: 46%; top: 30px; font: 700 18px var(--mono); color: var(--bg); background: var(--amber); padding: 4px 10px; border-radius: 6px; letter-spacing: 0.1em; }
        .t-card { position: absolute; left: 1290px; right: 120px; top: 250px; padding: 34px 38px; }
        .t-card .kicker { color: var(--indigo); }
        .t-card .name { font: 700 34px var(--mono); margin: 16px 0 22px; }
        .t-kv { display: flex; justify-content: space-between; padding: 20px 0; border-top: 2px solid var(--line); font: 400 26px var(--mono); }
        .t-kv .k2 { color: var(--muted); }
        .t-kv .v2 { color: var(--fg); }
        .t-hl { position: absolute; left: -10px; right: -10px; top: 6px; bottom: 6px; border: 3px solid var(--indigo); border-radius: 14px; display: block; }
        .t-note { position: absolute; left: 120px; top: 940px; font: 400 26px var(--mono); color: var(--muted); }
      </style>
      <div id="root" data-composition-id="s06-traces" data-width="1920" data-height="1080">
        <div class="t-stage">
          <div class="sig-tabs">
            <div class="sig-tab">01 LOGS</div>
            <div class="sig-tab t-t2">02 METRICS<span class="bar t-b2"></span></div>
            <div class="sig-tab t-t3">03 TRACES<span class="bar t-b3"></span></div>
            <div class="sig-tab t-t4">04 SPANS<span class="bar t-b4"></span></div>
          </div>
          <div class="panel t-wf">
            <div class="t-id"><span>trace_id</span><span class="hex">4bf92f3577b34da6a3ce929d0e0e4736</span></div>
            <div class="t-axis"><span style="left:0">0s</span><span style="left:25%">1s</span><span style="left:50%">2s</span><span style="left:75%">3s</span><span style="right:0">3.9s</span></div>
            <div class="t-row t-root"><div class="t-name">answer_question</div><div class="t-track"><span class="t-bar"></span></div></div>
            <div class="t-row t-r1"><div class="t-name"><span class="ind">└</span>search_docs</div><div class="t-track"><span class="t-bar"></span><span class="t-dur" style="left:9.5%">0.3s</span></div></div>
            <div class="t-row t-r2"><div class="t-name"><span class="ind">└</span>get_weather</div><div class="t-track"><span class="t-bar"></span><span class="t-retry">RETRY</span><span class="t-dur" style="left:45.5%;top:-6px">1.4s</span></div></div>
            <div class="t-row t-r3"><div class="t-name"><span class="ind">└</span>chat gpt-4o-mini</div><div class="t-track"><span class="t-bar"></span><span class="t-hl"></span></div></div>
          </div>
          <div class="panel t-card">
            <div class="kicker">Span</div>
            <div class="name">chat gpt-4o-mini</div>
            <div class="t-kv kv1"><span class="k2">model</span><span class="v2">gpt-4o-mini</span></div>
            <div class="t-kv kv2"><span class="k2">input tokens</span><span class="v2">640</span></div>
            <div class="t-kv kv3"><span class="k2">output tokens</span><span class="v2">172</span></div>
            <div class="t-kv kv4"><span class="k2">cost</span><span class="v2">$0.0002</span></div>
            <div class="t-kv kv5"><span class="k2">duration</span><span class="v2">2.1s</span></div>
            <div class="t-kv kv6"><span class="k2">parent</span><span class="v2">answer_question</span></div>
          </div>
          <div class="t-note">One trace, one ID. Every step is a span, nested under its parent.</div>
        </div>
      </div>
      <script>
        (() => {
          const D = 24.96;
          const tl = gsap.timeline({ paused: true });
          // tab: METRICS to TRACES
          tl.set(".t-t2", { color: "#eeeae0" }, 0);
          tl.fromTo(".t-b2", { scaleX: 1 }, { scaleX: 0, duration: 0.35, ease: "power2.in" }, 0.05);
          tl.to(".t-t2", { color: "#737c95", duration: 0.3 }, 0.15);
          tl.fromTo(".t-t3", { color: "#737c95" }, { color: "#eeeae0", duration: 0.3 }, 0.25);
          tl.fromTo(".t-b3", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.3);

          tl.fromTo(".t-wf", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.3);
          tl.fromTo(".t-root", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 2.2);
          tl.fromTo(".t-root .t-bar", { scaleX: 0 }, { scaleX: 1, duration: 2.4, ease: "power1.inOut" }, 2.4);
          // single trace ID types in
          tl.fromTo(".t-id", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 5.3);
          tl.fromTo(".t-id .hex", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 1.0, ease: "steps(32)" }, 5.5);

          // every step is a span
          tl.to(".t-t4", { color: "#eeeae0", duration: 0.3 }, 9.6);
          tl.fromTo(".t-b4", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 9.6);
          const row = (sel, at) => {
            tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.25 }, at);
            tl.fromTo(sel + " .t-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, at + 0.05);
            tl.fromTo(sel + " .t-dur", { opacity: 0 }, { opacity: 1, duration: 0.3 }, at + 0.5);
          };
          row(".t-r1", 10.9);
          row(".t-r2", 12.6);
          tl.fromTo(".t-retry", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, 13.2);
          row(".t-r3", 14.3);

          // the model span carries attributes
          tl.fromTo(".t-hl", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 16.2);
          tl.fromTo(".t-card", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.6, ease: "expo.out" }, 16.3);
          tl.fromTo(".t-card .kicker, .t-card .name", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 16.4);
          tl.fromTo(".kv1", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.3 }, 16.7);
          tl.fromTo([".kv2", ".kv3"], { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.3, stagger: 0.25 }, 18.0);
          tl.fromTo(".kv4", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.3 }, 19.6);
          tl.fromTo(".kv5", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.3 }, 20.5);
          tl.fromTo(".kv6", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.3 }, 21.8);
          // spans nest: the whole tree
          tl.to(".t-hl", { opacity: 0, duration: 0.3 }, 21.8);
          tl.to(".t-name .ind", { color: "#f5a800", duration: 0.3, stagger: 0.12 }, 21.9);
          tl.fromTo(".t-note", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 22.4);
          tl.to(".t-stage", { opacity: 0, duration: 0.4, ease: "power1.in" }, D - 0.42);
          window.__timelines["s06-traces"] = tl;
        })();
      </script>
    </template>
