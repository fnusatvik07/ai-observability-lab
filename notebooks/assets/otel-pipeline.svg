<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="420" rx="20" fill="#0B1020"/><rect width="1200" height="420" rx="20" fill="url(#g)"/>
  <text x="48" y="56" font-size="14" font-weight="700" letter-spacing="3" fill="#2DD4BF">HOW A SPAN TRAVELS</text>
  <text x="48" y="86" font-size="22" font-weight="700" fill="#F8FAFC">Instrument once, export anywhere</text>

  <rect x="40" y="160" width="250" height="160" rx="14" fill="#151B33" stroke="#334155"/>
  <text x="165" y="194" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="2" fill="#94A3B8">INSIDE YOUR PROCESS</text>
  <rect x="62" y="210" width="206" height="40" rx="9" fill="#1E1B4B" stroke="#8B5CF6"/>
  <text x="165" y="235" text-anchor="middle" font-size="14" fill="#F8FAFC">Tracer  →  Span</text>
  <rect x="62" y="262" width="206" height="40" rx="9" fill="#1E1B4B" stroke="#8B5CF6"/>
  <text x="165" y="287" text-anchor="middle" font-size="14" fill="#F8FAFC">TracerProvider + Resource</text>

  <rect x="340" y="190" width="200" height="100" rx="14" fill="#151B33" stroke="#22D3EE"/>
  <text x="440" y="230" text-anchor="middle" font-size="16" font-weight="700" fill="#F8FAFC">SpanProcessor</text>
  <text x="440" y="254" text-anchor="middle" font-size="13" fill="#94A3B8">Batch: buffer, send async</text>
  <text x="440" y="274" text-anchor="middle" font-size="13" fill="#94A3B8">Simple: send immediately</text>

  <rect x="590" y="190" width="180" height="100" rx="14" fill="#151B33" stroke="#F59E0B"/>
  <text x="680" y="230" text-anchor="middle" font-size="16" font-weight="700" fill="#F8FAFC">Exporter</text>
  <text x="680" y="254" text-anchor="middle" font-size="13" fill="#94A3B8">OTLP over HTTP</text>
  <text x="680" y="274" text-anchor="middle" font-size="13" fill="#94A3B8">or gRPC, Console</text>

  <rect x="820" y="190" width="150" height="100" rx="14" fill="#042F2E" stroke="#2DD4BF" stroke-dasharray="6 5"/>
  <text x="895" y="230" text-anchor="middle" font-size="16" font-weight="700" fill="#F8FAFC">Collector</text>
  <text x="895" y="254" text-anchor="middle" font-size="13" fill="#99F6E4">optional: redact,</text>
  <text x="895" y="274" text-anchor="middle" font-size="13" fill="#99F6E4">sample, fan out</text>

  <g font-size="15" font-weight="700" fill="#F8FAFC">
    <rect x="1020" y="130" width="150" height="48" rx="10" fill="#151B33" stroke="#334155"/><text x="1095" y="160" text-anchor="middle">Langfuse</text>
    <rect x="1020" y="192" width="150" height="48" rx="10" fill="#151B33" stroke="#334155"/><text x="1095" y="222" text-anchor="middle">LangSmith</text>
    <rect x="1020" y="254" width="150" height="48" rx="10" fill="#151B33" stroke="#334155"/><text x="1095" y="284" text-anchor="middle">Datadog</text>
    <rect x="1020" y="316" width="150" height="48" rx="10" fill="#151B33" stroke="#334155"/><text x="1095" y="346" text-anchor="middle">Dynatrace</text>
  </g>
  <g stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M290 240H336"/><path d="M540 240H586"/><path d="M770 240H816"/>
    <path d="M970 240C995 240 995 154 1016 154"/><path d="M970 240C995 240 995 216 1016 216"/>
    <path d="M970 240C995 240 995 278 1016 278"/><path d="M970 240C995 240 995 340 1016 340"/>
  </g>
  <text x="680" y="372" text-anchor="middle" font-size="13" fill="#94A3B8">Switching backends = changing OTEL_EXPORTER_OTLP_ENDPOINT and OTEL_EXPORTER_OTLP_HEADERS</text>
</svg>
